<!-- app/templates/stream.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ movie.title }} - HomeStream</title>
    <link rel="stylesheet" href="/static/styles/style.css">
</head>
<body>
    <header class="site-header">
        <div class="header-inner">
            <div class="brand">
                <div class="logo">HS</div>
                <div class="brand-text">
                    <h1>HomeStream</h1>
                    <span>Now Playing</span>
                </div>
            </div>
        </div>
    </header>

    <main class="stream-shell">
        <div class="stream-header">
            <div class="stream-title">
                <h2>{{ movie.title }}</h2>
                <p>Enjoy your movie.</p>
            </div>

            <div class="stream-controls">
                <a href="/" class="btn">← Back to Library</a>
            </div>
        </div>

        <div class="player-card">
            <div class="video-container">
                <video id="player" controls autoplay>
                    <source id="player-source" src="{{ video_src }}" type="video/{{ video_src.split('=')[-1] }}">
                    Your browser does not support HTML5 video.
                </video>
            </div>
        </div>
    </main>

    <footer class="site-footer">
        HomeStream • Personal Media Server
    </footer>

    <script>
        function switchFormat(fmt) {
            const player = document.getElementById('player');
            const source = document.getElementById('player-source');
            const movieId = {{ movie.id }};

            source.src = `/stream-file/${movieId}?format=${fmt}`;
            source.type = `video/${fmt}`;
            player.load();
            player.play();
        }
    </script>
</body>
</html>
